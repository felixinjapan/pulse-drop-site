<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PulseDrop</title>
<meta name="description" content="PulseDrop is a portrait arcade game. Privacy policy and support.">
<style>
  :root { color-scheme: dark; --ink: #070b14; --text: #e8eef9; --muted: #93a0b8; --cyan: #3de0ff; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--ink); color: var(--text); font: 17px/1.6 -apple-system, system-ui, "Segoe UI", sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 48px 20px 64px; }
  h1 { font-size: 2.2rem; margin: 0 0 8px; }
  p { color: var(--muted); }
  ul { list-style: none; padding: 0; margin: 28px 0 0; }
  li { margin: 12px 0; }
  a { color: var(--cyan); text-decoration: none; font-weight: 600; }
  a:hover, a:focus { text-decoration: underline; }
</style>
</head>
<body>
<main>
  <h1>PulseDrop</h1>
  <p>An independent portrait arcade game.</p>
  <ul>
    <li><a href="privacy/">Privacy policy</a></li>
    <li><a href="support/">Support</a></li>
  </ul>
</main>
</body>
</html>
